<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="ونسة: ألعاب وأمثال وحكاوي من السودان"><meta name="theme-color" content="#8a1d33"><title>ونسة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style><style>
/* Layout: phone-first single column, fixed bottom tab bar; Naskh for titles, Plex for reading and tapping.
   Themes: نهاري (karkadeh on warm paper), ليلي (deep karkadeh), ليل النيل (navy night with stars). Tabag weave is the recurring Sudanese mark. */
:root {
  --bg: #faf3ee; --surface: #ffffff; --surface-2: #f5e7e1; --line: #e3cbc2;
  --ink: #2c0a13; --muted: #6b4a4c; --accent: #8a1d33; --accent-ink: #ffffff;
  --gold: #a56f0c; --green: #2e6b3f; --tab1: #8a1d33; --nile: #2f6d9a; --nile-soft: #9cc3de;
  --good-bg: #e4f1dc; --good: #2b6418; --bad-bg: #fbe0da; --bad: #a3271a;
  --stars: transparent;
  --f-title: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
  --f-ui: "IBM Plex Sans Arabic", "Noto Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #240910; --surface: #3a0f1b; --surface-2: #4b1726; --line: #6d2e3c;
  --ink: #f7e8dc; --muted: #d2b2a8; --accent: #e9b455; --accent-ink: #2b0a12;
  --gold: #e9b455; --green: #85c895; --tab1: #c4425d; --nile: #6aa7d4; --nile-soft: #3d6a8c;
  --good-bg: #1e3c19; --good: #b6e39c; --bad-bg: #4d1717; --bad: #ff9c8c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #240910; --surface: #3a0f1b; --surface-2: #4b1726; --line: #6d2e3c;
  --ink: #f7e8dc; --muted: #d2b2a8; --accent: #e9b455; --accent-ink: #2b0a12;
  --gold: #e9b455; --green: #85c895; --tab1: #c4425d; --nile: #6aa7d4; --nile-soft: #3d6a8c;
  --good-bg: #1e3c19; --good: #b6e39c; --bad-bg: #4d1717; --bad: #ff9c8c; color-scheme: dark; }
:root[data-wtheme="nile"] {
  --bg: #0b1726; --surface: #12233a; --surface-2: #1a3150; --line: #29476a;
  --ink: #eef3f8; --muted: #a9bccf; --accent: #ecbb5c; --accent-ink: #1a1206;
  --gold: #ecbb5c; --green: #8fd0a0; --tab1: #d0566c; --nile: #7fb6e0; --nile-soft: #2c5378;
  --good-bg: #173a2a; --good: #a8e6b8; --bad-bg: #42192a; --bad: #ff9fa8;
  --stars: rgba(255,255,255,.55); color-scheme: dark; }

* { box-sizing: border-box; }
html { font-size: 100%; overflow-x: hidden; }
html.fs1 { font-size: 114%; }
html.fs2 { font-size: 130%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 1.12rem; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(7rem + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
  background-image:
    radial-gradient(1.2px 1.2px at 12% 18%, var(--stars) 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 9%, var(--stars) 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 40% 33%, var(--stars) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 41%, var(--stars) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 23% 62%, var(--stars) 50%, transparent 51%),
    radial-gradient(1px 1px at 60% 74%, var(--stars) 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 92% 86%, var(--stars) 50%, transparent 51%);
  background-attachment: fixed;
}
.app { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.1rem; min-width: 0; }
.app > * { min-width: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--f-title); font-weight: 700; margin: 0; line-height: 1.45; text-wrap: balance; }
p { margin: 0; }
.tabag { display: block; width: 100%; height: 12px; border-radius: 3px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.logo { font-family: var(--f-title); font-weight: 700; font-size: 2rem; color: var(--accent); line-height: 1.2; background: none; border: 0; padding: 0; cursor: pointer; }
.top-r { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 2.7rem; padding: 0 .85rem; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer; }
.pill svg { width: 1.3rem; height: 1.3rem; }
.cup-ic path { fill: var(--gold); }

/* bottom nav */
nav.tabs {
  position: fixed; inset: auto 0 0 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
}
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); gap: 2px; }
nav.tabs button { background: none; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 14px; color: var(--muted); font-size: .8rem; font-weight: 600; min-height: 3.6rem; min-width: 0; }
nav.tabs button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
nav.tabs svg { width: 1.55rem; height: 1.55rem; flex: none; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--surface-2); }

/* generic */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 1.2rem 1.1rem; display: flex; flex-direction: column; gap: .9rem; min-width: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-h h2 { font-size: 1.5rem; }
.sec-h span { color: var(--muted); font-size: .95rem; }
.muted { color: var(--muted); }
.small { font-size: .95rem; }
.btn { min-height: 3.4rem; padding: 0 1.5rem; border-radius: 999px; border: 0; cursor: pointer; font-weight: 700; background: var(--accent); color: var(--accent-ink); font-size: 1.12rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.back { align-self: flex-start; min-height: 2.8rem; padding: 0 1.1rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.bar { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 6px; }
.page-h { font-size: 1.9rem; }
.stack { display: flex; flex-direction: column; gap: 10px; align-self: stretch; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .two { grid-template-columns: 1fr; } }
.speak { display: inline-flex; align-items: center; gap: 6px; min-height: 2.6rem; padding: 0 .9rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-weight: 700; font-size: .95rem; align-self: flex-start; }
.speak svg { width: 1.25rem; height: 1.25rem; }
.row-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.toast { position: fixed; z-index: 30; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(5.4rem + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; background: var(--ink); color: var(--bg); padding: .8rem 1rem; border-radius: 16px; font-weight: 600; text-align: center; }

/* home */
.hello { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
.hello .in { padding: 1rem 1.1rem 1.1rem; display: flex; flex-direction: column; gap: .25rem; }
.hello h1 { font-size: 1.8rem; }
.dates { color: var(--muted); font-size: .98rem; }
.cta { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; text-align: start; cursor: pointer; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 22px; padding: 1rem 1.1rem; width: 100%; }
.cta .ic { width: 3.4rem; height: 3.4rem; border-radius: 16px; background: color-mix(in srgb, currentColor 16%, transparent); display: grid; place-items: center; }
.cta .ic svg { width: 2.1rem; height: 2.1rem; }
.cta b { font-family: var(--f-title); font-size: 1.35rem; display: block; line-height: 1.4; }
.cta span { font-size: 1rem; opacity: .95; }
.cta.c-green { background: #2e6b3f; color: #fff; }
.cta.c-nile { background: #1f5f8b; color: #fff; }
.cta.c-clay { background: #b4561f; color: #fff; }
.cta.c-plum { background: #6a3a86; color: #fff; }
.cta.done { background: var(--surface-2); color: var(--ink); cursor: default; }
.say-card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 1.1rem; display: flex; flex-direction: column; gap: .45rem; }
.say-card .tag { font-size: .9rem; font-weight: 700; color: var(--gold); }
.say { font-family: var(--f-title); font-weight: 700; font-size: 1.7rem; line-height: 1.6; }
.row-link { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: .9rem 1rem; cursor: pointer; width: 100%; min-height: 3.6rem; }
.row-link b { font-family: var(--f-title); font-size: 1.25rem; display: block; line-height: 1.4; }
.row-link small { color: var(--muted); font-size: .95rem; display: block; }
.row-link .chev { color: var(--muted); font-size: 1.4rem; }

/* tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 440px) { .tiles { grid-template-columns: 1fr; } }
.tile { text-align: start; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 1rem; display: flex; flex-direction: column; gap: .35rem; transition: border-color .2s, transform .1s; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile:active { transform: scale(.985); }
.mark { align-self: flex-start; min-width: 3.6rem; height: 3.6rem; padding: 0 .7rem; border-radius: 16px; display: grid; place-items: center; font-family: var(--f-title); font-weight: 700; font-size: 1.2rem; color: #fff; }
.tile b { font-family: var(--f-title); font-size: 1.4rem; line-height: 1.4; }
.tile .d { color: var(--muted); font-size: .98rem; }
.tile .meta { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; flex-wrap: wrap; }

/* play */
.ghead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.gtitle { font-family: var(--f-title); font-weight: 700; font-size: 1.55rem; }
.prog { font-size: 1rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.track span { height: 8px; border-radius: 4px; background: var(--line); }
.track .ok { background: var(--good); } .track .no { background: var(--bad); } .track .now { background: var(--accent); }
.turn { border-radius: 18px; padding: .8rem 1rem; font-weight: 700; font-size: 1.25rem; text-align: center; color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: .35rem .9rem; border-radius: 999px; background: var(--surface-2); font-weight: 600; font-size: 1rem; font-variant-numeric: tabular-nums; border: 2px solid transparent; }
.chip.on { border-color: var(--accent); }
.ask { font-size: 1.02rem; color: var(--muted); font-weight: 700; }
.big { font-family: var(--f-title); font-weight: 700; font-size: clamp(2rem, 8.5vw, 2.7rem); line-height: 1.65; text-align: center; text-wrap: balance; }
.big .blank { display: inline-block; min-width: 2.6em; border-bottom: 3px dashed var(--accent); color: var(--accent); }
.big .fill { color: var(--accent); }
.clue { font-family: var(--f-title); font-weight: 700; font-size: 1.4rem; text-align: center; text-wrap: balance; line-height: 1.75; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opts.tf, .opts.letters { flex-direction: row; flex-wrap: wrap; }
.opts.tf .opt, .opts.letters .opt { flex: 1 1 40%; text-align: center; font-weight: 700; font-size: 1.3rem; }
.opt { min-height: 3.6rem; width: 100%; text-align: start; cursor: pointer; background: var(--surface-2); border: 2px solid transparent; border-radius: 16px; padding: .6rem 1.1rem; font-size: 1.18rem; font-weight: 500; line-height: 1.55; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: .55; }
.opt.right { opacity: 1; background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 700; }
.opt.wrong { opacity: 1; background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.reveal { border-top: 1px solid var(--line); padding-top: 1rem; display: flex; flex-direction: column; gap: .6rem; animation: rise .35s ease; }
.verdict { font-size: 1.3rem; font-weight: 700; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
.reveal h3 { font-family: var(--f-ui); font-size: .95rem; color: var(--muted); font-weight: 600; }

/* tartib */
.slots { min-height: 4.4rem; border: 2px dashed var(--line); border-radius: 18px; padding: .6rem; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.slots.ok { border-color: var(--good); background: var(--good-bg); }
.slots.no { border-color: var(--bad); background: var(--bad-bg); }
.wpool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.word { min-height: 3.2rem; padding: 0 1rem; border-radius: 14px; border: 2px solid var(--line); background: var(--surface-2); cursor: pointer; font-family: var(--f-title); font-weight: 700; font-size: 1.35rem; }
.word.placed { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.word:disabled { cursor: default; }
.slots .hint { color: var(--muted); font-size: 1rem; align-self: center; padding: 0 .4rem; }

/* pairs */
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.pcard { min-height: 5.6rem; border-radius: 16px; border: 2px solid var(--line); cursor: pointer; padding: .4rem; font-weight: 700; font-size: 1.02rem; line-height: 1.45; display: grid; place-items: center; text-align: center; background: var(--surface); overflow-wrap: anywhere; }
.pcard.back { background: repeating-linear-gradient(135deg, var(--tab1) 0 10px, var(--gold) 10px 20px, var(--ink) 20px 24px); border-color: var(--ink); }
.pcard.word-c { font-family: var(--f-title); font-size: 1.3rem; }
.pcard.open { border-color: var(--accent); }
.pcard.done { background: var(--good-bg); border-color: var(--good); color: var(--good); cursor: default; }

/* map */
.map { background: var(--surface-2); border-radius: 18px; overflow: hidden; }
.map svg { display: block; width: 100%; height: auto; }
.map .lbl { font-family: var(--f-ui); font-weight: 700; fill: var(--ink); }
.map .lbl-m { font-family: var(--f-ui); fill: var(--muted); }

/* end */
.end { text-align: center; align-items: center; }
.end .num { font-size: 3.4rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
.end .rank { font-family: var(--f-title); font-weight: 700; font-size: 1.8rem; }
.earned { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--gold); font-size: 1.15rem; }
.earned svg { width: 1.6rem; height: 1.6rem; }
.newb { background: var(--surface-2); border-radius: 18px; padding: .9rem; display: flex; gap: 12px; align-items: center; text-align: start; align-self: stretch; }
.copied { color: var(--muted); font-size: 1rem; min-height: 1.5em; overflow-wrap: anywhere; }

/* segmented */
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { min-height: 2.8rem; padding: 0 1rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* library + forms */
.search, .field input, .field select, .field textarea { width: 100%; min-height: 3.2rem; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 1rem; font-size: 1.08rem; min-width: 0; }
.search { background: var(--surface); }
.field textarea { padding: .7rem 1rem; min-height: 7rem; resize: vertical; line-height: 1.7; }
.entries { display: flex; flex-direction: column; gap: 10px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: .9rem 1rem; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; }
.entry .t { font-family: var(--f-title); font-weight: 700; font-size: 1.3rem; line-height: 1.6; overflow-wrap: anywhere; }
.entry .m { grid-column: 1 / -1; font-size: 1.02rem; overflow-wrap: anywhere; }
.entry .n { grid-column: 1 / -1; font-size: .98rem; color: var(--muted); overflow-wrap: anywhere; }
.entry .got { grid-column: 1 / -1; font-size: .85rem; font-weight: 700; color: var(--gold); }
.icon-btn { background: none; border: 0; cursor: pointer; width: 2.8rem; height: 2.8rem; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.icon-btn svg { width: 1.5rem; height: 1.5rem; }
.icon-btn[aria-pressed="true"] { color: var(--tab1); }
.icon-btn[aria-pressed="true"] path { fill: currentColor; }
.empty { text-align: center; color: var(--muted); padding: 1.2rem 0; }
.count { font-size: .95rem; color: var(--muted); }

/* heritage */
.arts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 440px) { .arts { grid-template-columns: 1fr; } }
.art-c { text-align: start; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; padding: 0; min-width: 0; }
.art-c .stripe { height: 8px; }
.art-c .tx { padding: .8rem 1rem 1rem; display: flex; flex-direction: column; gap: .2rem; }
.art-c b { font-family: var(--f-title); font-size: 1.35rem; }
.art-c span { color: var(--muted); font-size: .95rem; }
.art-c .rd { color: var(--gold); font-size: .85rem; font-weight: 700; }
.article h1 { font-size: 2rem; }
.article .lead { font-size: 1.15rem; color: var(--muted); }
.article p { max-width: 62ch; }
.factbox { background: var(--surface-2); border-radius: 18px; padding: 1rem; display: flex; flex-direction: column; gap: .3rem; }
.factbox b { color: var(--gold); font-size: .95rem; }
.ing { margin: 0; padding-inline-start: 1.3rem; display: flex; flex-direction: column; gap: .2rem; }
.steps { margin: 0; padding-inline-start: 1.5rem; display: flex; flex-direction: column; gap: .5rem; }
.steps li::marker { font-weight: 700; color: var(--gold); }
.occ { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: .9rem 1rem; }
.occ b { font-family: var(--f-title); font-size: 1.3rem; }
.occ .left { text-align: center; background: var(--surface-2); border-radius: 14px; padding: .3rem .8rem; font-variant-numeric: tabular-nums; }
.occ .left strong { display: block; font-size: 1.5rem; line-height: 1.2; color: var(--accent); }
.occ .left span { font-size: .8rem; color: var(--muted); }
.occ p { grid-column: 1 / -1; font-size: 1rem; }
.occ .when { color: var(--muted); font-size: .95rem; }

/* childhood */
.kid-cat { display: flex; flex-direction: column; gap: 10px; }
.kid { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: .9rem 1rem; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: start; }
.kid b { font-family: var(--f-title); font-size: 1.3rem; line-height: 1.5; }
.kid p { grid-column: 1 / -1; font-size: 1.02rem; }
.lived { min-height: 2.6rem; padding: 0 .9rem; border-radius: 999px; border: 2px solid var(--line); background: transparent; cursor: pointer; font-weight: 700; font-size: .95rem; white-space: nowrap; }
.lived[aria-pressed="true"] { background: #2e6b3f; border-color: #2e6b3f; color: #fff; }

/* danagla */

const TTS = { ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined', voice: null };
function pickVoice() {
  if (!TTS.ok) return;
  try {
    const vs = speechSynthesis.getVoices();
    TTS.voice = ['ar-sd','ar-eg','ar-sa','ar'].map(l => vs.find(v => v.lang && v.lang.toLowerCase().replace('_','-').startsWith(l))).find(Boolean) || null;
  } catch(e) {}
}
if (TTS.ok) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch(e) {} }
function speak(text) { return; }
function speakOld(text) {
  if (!TTS.ok) { toast('القراية بالصوت ما شغّالة في المتصفح ده.'); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = TTS.voice ? TTS.voice.lang : 'ar-SA';
    if (TTS.voice) u.voice = TTS.voice;
    u.rate = 0.88;
    speechSynthesis.speak(u);
    if (!TTS.voice) setTimeout(() => { pickVoice(); if (!TTS.voice) toast('لو ما سمعت صوت: تلفونك محتاج صوت عربي من إعدادات القراية بالصوت.'); }, 1200);

}

async function initFamily() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') { FAM.status = 'off'; refreshFamily(); return; }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) { FAM.status = 'off'; refreshFamily(); return; }
    FAM.db = db; FAM.user = user;
    FAM.uid = await user.id();
    FAM.owner = await user.isOwner();
    if (!FAM.uid) { FAM.status = 'off'; refreshFamily(); return; }
    const timer = setTimeout(() => { if (!FAM.loaded) { FAM.status = 'slow'; refreshFamily(); } }, 10000);
    db.collection('family').onSnapshot(snap => {
      FAM.members = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      FAM.me = FAM.members.find(m => m.id === FAM.uid) || null;
      if (!snap.metadata.fromCache) { FAM.loaded = true; clearTimeout(timer); }
      FAM.status = 'ready';
      rebuildDongolawi();
      refreshFamily();
    }, () => { clearTimeout(timer); FAM.status = 'error'; refreshFamily(); });
  } catch(e) { FAM.status = 'off'; refreshFamily(); }
}
function writeMe(mut) {
  FAM.q = FAM.q.then(async () => {
    const base = JSON.parse(JSON.stringify(FAM.me || { name:'', cups:0, stories:[], words:[] }));
    delete base.id;
    base.stories = base.stories || []; base.words = base.words || [];
    mut(base);
    base.rank = rankOf(base.cups || 0).r.t;
    base.updated = Date.now();
    await FAM.db.doc('family/' + FAM.uid).set(base);
  }).catch(e => { toast(writeErr(e)); });
  return FAM.q;
}
function writeErr(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'الدفتر اتملا. امسحوا حاجات قديمة عشان تكتبوا جديد.';

  return 'ما قدرنا نحفظ. ممكن ما عندك إذن الكتابة، اطلب من صاحب ونسة يديك إذن المشاركة.';
}

function makeQ(g, i, r=Math.random) {
  const G = DATA[g], it = G.items[i];
  if (G.tf) return { g, i, a: it.a, ch: ['صاح','غلط'] };
  if (G.map) {
    const me = CITIES.find(c => c.n === it.a);
    const far = shuffle(CITIES.filter(c => c.n !== me.n && Math.hypot(c.lon-me.lon, c.lat-me.lat) > 1.6), r);
    const pick = [];
    for (const c of far) { if (pick.every(p => Math.hypot(p.lon-c.lon, p.lat-c.lat) > 1.4)) pick.push(c); if (pick.length === 3) break; }
    return { g, i, a: it.a, ch: shuffle([me.n, ...pick.map(p => p.n)], r) };
  }
  const wrong = it.x ? it.x.slice(0,3) : shuffle([...new Set(G.items.map(o => o.a).filter(a => a !== it.a))], r).slice(0,3);
  return { g, i, a: it.a, ch: shuffle([it.a, ...wrong], r) };
}

let HFMT = null;
try { HFMT = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', { month:'numeric', day:'numeric' }); } catch(e) {}
function hijriMD(d) {
  if (!HFMT) return null;
  try { const p = HFMT.formatToParts(d); return [+p.find(x => x.type === 'month').value, +p.find(x => x.type === 'day').value]; } catch(e) { return null; }
}
let OCC_CACHE = null;
function occasions() {
  if (OCC_CACHE && OCC_CACHE.day === today()) return OCC_CACHE.list;
  const base = new Date(); base.setHours(12,0,0,0);
  const list = [];
  OCCASIONS.forEach(o => {
    for (let k = 0; k < 400; k++) {
      const d = new Date(base); d.setDate(base.getDate() + k);
      let hit = false;
      if (o.g) hit = d.getMonth()+1 === o.g[0] && d.getDate() === o.g[1];
      else { const md = hijriMD(d); hit = !!md && md[0] === o.h[0] && md[1] === o.h[1]; }
      if (hit) { list.push(Object.assign({ date: d, days: k }, o)); break; }
    }
  });
  list.sort((a,b) => a.days - b.days);
  OCC_CACHE = { day: today(), list };
  return list;
}
const gDate = d => { try { return new Intl.DateTimeFormat('ar-EG', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(d); } catch(e) { return fmt(d); } };

/* ================= لعبة الأزواج ================= */
function startPairs() {
  const picks = shuffle(DATA.kalimat.items.map((_,i) => i)).slice(0, 6);
  const cards = shuffle(picks.flatMap(i => [{ p:i, t:DATA.kalimat.items[i].q, w:true }, { p:i, t:DATA.kalimat.items[i].a, w:false }]));
  S.play = { mode:'pairs', cards, open:[], matched:[], moves:0, lock:false, before: earnedIds() };
}
function renderPairs() {
  const pl = S.play;
  if (pl.matched.length === pl.cards.length) return renderPairsEnd();
  $('#stage').innerHTML = `
    <button class="back" id="quit">‹ الألعاب</button>
    <div class="ghead"><span class="gtitle">لعبة الأزواج</span><span class="prog">محاولات: ${AR(pl.moves)} · لقيت ${AR(pl.matched.length/2)} من ٦</span></div>
    <section class="card">
      <div class="ask">افتح كرتين. لو الكلمة لاقت معناها بيفضلوا مفتوحين.</div>
      <div class="pgrid">${pl.cards.map((c,k) => {
        const m = pl.matched.includes(k), o = pl.open.includes(k);
        const cls = m ? 'done' : o ? 'open' : 'back';
        return `<button class="pcard ${cls} ${(m||o) && c.w ? 'word-c' : ''}" data-k="${k}" ${m?'disabled':''} aria-label="${m||o ? esc(c.t) : 'كرت مقفول'}">${m||o ? esc(c.t) : ''}</button>`;
      }).join('')}</div>
    </section>`;
  $('#quit').addEventListener('click', () => { S.play = null; go('games'); });
  $('#stage').querySelectorAll('.pcard').forEach(b => b.addEventListener('click', () => flip(+b.dataset.k)));
}
function flip(k) {
  const pl = S.play;
  if (pl.lock || pl.matched.includes(k) || pl.open.includes(k)) return;
  pl.open.push(k);
  if (pl.open.length === 2) {
    pl.moves++;
    const [a, b] = pl.open;
    if (pl.cards[a].p === pl.cards[b].p) { pl.matched.push(a, b); pl.open = []; renderPairs(); }
    else { pl.lock = true; renderPairs(); setTimeout(() => { pl.open = []; pl.lock = false; if (S.play === pl) renderPairs(); }, 1100); }
  } else renderPairs();
}
function renderPairsEnd() {
  const pl = S.play;
  if (!pl.saved) {
    pl.cups = pl.moves <= 9 ? 5 : 3; P.cups += pl.cups; P.pairsDone++;
    if (!P.best.pairs || pl.moves < P.best.pairs) P.best.pairs = pl.moves;
    if (!has(P.days, today())) P.days.push(today());
    pl.saved = true; save(); syncCups(); renderChrome();
  }
  const nexts = [['play-kalimat', 'العب «كلمات سودانية»', 'اختبر الكلمات بالأسئلة'], ...standardNexts(null)];
  $('#stage').innerHTML = endCard({ title:'لعبة الأزواج', s:0, n:0, cups: pl.cups, fresh: freshBadges(pl.before), again: true, unit: AR(pl.moves) + ' محاولة' }) + nextList(nexts);
  $('#again').addEventListener('click', () => { startPairs(); renderPairs(); window.scrollTo(0,0); });
  $('#copy').addEventListener('click', () => copyText(`خلّصت «لعبة الأزواج» في ونسة في ${AR(pl.moves)} محاولة. تقدر تغلبني؟`));
  bindNext(nexts);
}

function famUnavailableNote() {

  if (FAM.status === 'off' || FAM.status === 'error') return '<p class="muted small">دفتر العيلة بيشتغل لمّا تفتح ونسة من الرابط وإنت مسجّل دخول.</p>';

function fillDanFamily() {

}

  $('#save-entry').addEventListener('click', saveEntry);

async function saveEntry() {
  if (FAM.status !== 'ready') { toast('الدفتر ما شغّال هنا. افتح ونسة من الرابط وإنت مسجّل دخول.'); return; }
  if (!FAM.me || !FAM.me.name) { toast('انضم للوحة العيلة باسمك الأول.'); const f = $('#fam-name'); if (f) f.focus(); return; }
  const cat = S.famCat in CATS ? S.famCat : 'hikaya';
  const before = earnedIds();
  if (cat === 'word') {
    const w = $('#w-w').value.trim(), m = $('#w-m').value.trim(), n = $('#w-n').value.trim();
    if (!w || !m) { toast('اكتب الكلمة ومعناها.'); return; }
    if ((FAM.me.words || []).length >= 150) { toast('كتبت كلمات كتيرة. امسح القديمة عشان تزيد.'); return; }
    await writeMe(b => { b.words.push({ id: rid(), w, m, note: n, at: Date.now() }); });
  } else {
    const t = $('#s-t').value.trim(), body = $('#s-b').value.trim();
    if (!body) { toast('اكتب الحكاية الأول.'); return; }
    if ((FAM.me.stories || []).length >= 80) { toast('الدفتر بتاعك اتملا. امسح حكاية قديمة عشان تزيد.'); return; }
    await writeMe(b => { b.stories.push({ id: rid(), cat, title: t, body, at: Date.now() }); });
  }
  toast('اتحفظت في الدفتر.');
  const f = freshBadges(before); if (f.length) setTimeout(() => toast('وسام جديد: ' + f[0].t), 1500);
  renderCompose();
}
function storyHtml(s) {
  const mine = s.owner === FAM.uid, canDel = mine || FAM.owner;
  let when = ''; try { when = new Intl.DateTimeFormat('ar-EG', { day:'numeric', month:'long', year:'numeric' }).format(new Date(s.at)); } catch(e) {}
  const body = s.cat === 'word' ? 'المعنى: ' + (s.m || '') + (s.note ? '\n' + s.note : '') : (s.body || '');
  return `<div class="story"><div class="t"><span class="cat-tag">${esc(CATS[s.cat] || '')}</span>${esc(s.cat === 'word' ? s.w : (s.title || ''))}</div>
    ${canDel ? `<button class="icon-btn del" data-o="${esc(s.owner)}" data-id="${esc(s.id)}" data-kind="${s.cat === 'word' ? 'words' : 'stories'}" aria-label="امسح">${ICON.trash}</button>` : '<span></span>'}
    <div class="b">${esc(body)}</div>
    <div class="by">كتبها ${esc(s.by)}${when ? ' · ' + when : ''}</div></div>`;
}
function bindStoryDeletes(root) {
  root.querySelectorAll('.del').forEach(b => b.addEventListener('click', () => {
    const owner = b.dataset.o, id = b.dataset.id, kind = b.dataset.kind;
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.style.color = 'var(--bad)'; toast('اضغط تاني عشان تمسحها.'); return; }
    if (owner === FAM.uid) writeMe(x => { x[kind] = (x[kind] || []).filter(s => s.id !== id); });
    else {
      const m = FAM.members.find(z => z.id === owner); if (!m) return;
      FAM.db.doc('family/' + owner).update({ [kind]: (m[kind] || []).filter(s => s.id !== id) }).catch(e => toast(writeErr(e)));
    }
  }));
}
function fillFamilyStories() {
  const el = $('#fam-stories'), fl = $('#fam-filter'); if (!el) return;
  const f = S.famFilter || 'all';
  if (fl) {
    fl.innerHTML = [['all','الكل'], ...Object.entries(CATS)].map(([id,t]) => `<button data-f="${id}" aria-pressed="${f===id}">${t}</button>`).join('');
    fl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { S.famFilter = b.dataset.f; fillFamilyStories(); }));
  }
  if (FAM.status !== 'ready') { el.innerHTML = famUnavailableNote(); return; }
  let list = [];
  if (f !== 'word') list = famStories(f === 'all' ? null : f);
  if (f === 'all' || f === 'word') {
    FAM.members.forEach(m => (m.words || []).forEach(w => list.push(Object.assign({ by: m.name || 'واحد من العيلة', owner: m.id, cat:'word' }, w))));
    list.sort((a,b) => (b.at||0) - (a.at||0));
  }
  el.innerHTML = list.length ? list.map(storyHtml).join('') : '<div class="empty">الدفتر فاضي لسه. اكتب أول حكاية!</div>';
  bindStoryDeletes(el);
}

    <div class="sec-h"><h2>صندوقي</h2><span>اللي جاوبتو صاح</span></div>
    <section class="card coll">${COLLECT.map(id => { const g = DATA[id], c = gotCount(id); return `<div class="coll-row"><span>${esc(g.title)}</span><div class="bar"><i style="width:${Math.round(c/g.items.length*100)}%"></i></div><span>${AR(c)}/${AR(g.items.length)}</span></div>`; }).join('')}
      <div class="coll-row"><span>ذكريات الطفولة</span><div class="bar"><i style="width:${Math.round(P.lived.length/KID_TOTAL*100)}%"></i></div><span>${AR(P.lived.length)}/${AR(KID_TOTAL)}</span></div></section>
    <div class="sec-h"><h2>الألقاب</h2></div>
    <section class="card coll">${RANKS.map(x => `<div class="coll-row" style="grid-template-columns:1fr auto"><span style="${x===r?'font-weight:700;color:var(--accent)':''}">${x.t}${x===r?' ← إنت هنا':''}</span><span>${AR(x.min)} فنجان</span></div>`).join('')}</section>
    <div id="reset-area"><button class="btn ghost block" id="reset">ابدأ من جديد</button></div>`;
  $('#simple-row').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { P.simple = b.dataset.s === '1'; if (P.simple && P.fs < 1) setFs(1); save(); renderChrome(); renderMe(); }));
  $('#th-row').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { P.theme = b.dataset.th; save(); applyTheme(); renderChrome(); renderMe(); }));
  $('#fs-row').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { setFs(+b.dataset.fs); renderChrome(); renderMe(); }));
  $('#reset').addEventListener('click', () => {
    $('#reset-area').innerHTML = `<div class="confirm"><b>متأكد؟ الفناجين والأوسمة والمحفوظات وذكريات الطفولة البتاعة التلفون ده بتتمسح. دفتر العيلة ما بيتمسح.</b>
      <div class="two"><button class="btn" id="yes" style="background:var(--bad);color:#fff">أيوه، امسح</button><button class="btn ghost" id="no">لا، خلّيها</button></div></div>`;
    $('#yes').addEventListener('click', () => { const { fs, theme, simple, autoRead } = P; P = Object.assign({}, DEF, { fs, theme, simple, autoRead }); save(); syncCups(); renderChrome(); renderMe(); });
    $('#no').addEventListener('click', renderMe);
  });
}

/* ================= boot ================= */
function start(data) {
  if (data && data.S) S = Object.assign(S, data.S);
  route();
  initFamily();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body></html>
